name: Build StudyLock APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDK=/usr/local/lib/android/sdk
          echo "$SDK/platform-tools" >> $GITHUB_PATH

          CMDLINE=$(find "$SDK/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          echo "$(dirname "$CMDLINE")" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          SDK=/usr/local/lib/android/sdk
          CMDLINE=$(find "$SDK/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          yes | "$CMDLINE" --licenses || true

          "$CMDLINE" "platforms;android-35"
          "$CMDLINE" "build-tools;35.0.0"
          
      - name: Run schedule unit tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
